services:
  - type: web
    name: fazoochat-api
    runtime: node
    rootDir: packages/api
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
      - key: GEMINI_EMBEDDING_URL
        value: https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PORT
        value: 10000
